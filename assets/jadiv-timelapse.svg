<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6efd"/>
      <stop offset="1" stop-color="#198754"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>

  <!-- clapperboard -->
  <g transform="rotate(-6 128 140)">
    <!-- clapper top bar -->
    <g>
      <rect x="58" y="70" width="140" height="30" rx="6" fill="#ffffff"/>
      <g fill="#0d6efd">
        <polygon points="66,70 86,70 70,100 58,100 58,92"/>
        <polygon points="98,70 118,70 102,100 82,100"/>
        <polygon points="130,70 150,70 134,100 114,100"/>
        <polygon points="162,70 182,70 166,100 146,100"/>
        <polygon points="194,70 198,74 198,100 178,100"/>
      </g>
    </g>
    <!-- board body -->
    <rect x="58" y="104" width="140" height="86" rx="8" fill="#ffffff"/>
  </g>

  <!-- clock face conveying time-lapse, on the board body -->
  <g transform="rotate(-6 128 140)">
    <circle cx="128" cy="148" r="30" fill="none" stroke="#198754" stroke-width="9"/>
    <line x1="128" y1="148" x2="128" y2="130" stroke="#198754" stroke-width="9" stroke-linecap="round"/>
    <line x1="128" y1="148" x2="143" y2="156" stroke="#198754" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
