<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadiv-Timelapse Web</title>
    <script defer src="https://keepandroidopen.org/banner.js"></script>
    <style>
        /* Moderný Dark Mode dizajn inšpirovaný tvojou PyQt5 aplikáciou */
        :root {
            --bg-color: #2b2b2b;
            --surface-color: #3c3f41;
            --text-color: #e0e0e0;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --success-color: #198754;
            --border-color: #555555;
            --danger-color: #dc3545;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            width: 150px;
            font-weight: bold;
        }

        .form-control {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        input[type="file"] {
            padding: 7px;
        }

        input[type="file"]::file-selector-button {
            background-color: #444;
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .fps-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .fps-wrap input {
            width: 80px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 25px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            height: 24px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            background-color: var(--success-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-style: italic;
            color: #aaa;
            font-size: 14px;
        }

        #previewCanvas {
            display: none;
        }

        #versionBadge {
            position: fixed;
            bottom: 8px;
            right: 12px;
            font-size: 12px;
            color: #888888;
        }

        #updateBanner {
            display: none;
            background-color: var(--primary-color);
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        #updateBanner.visible {
            display: flex;
        }

        #updateBanner a {
            color: white;
            font-weight: bold;
        }

        #updateBanner button {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Jadiv-Timelapse Web</h1>

        <div id="updateBanner">
            <span id="updateBannerText"></span>
            <button id="updateBannerClose" title="Zavrieť" aria-label="Zavrieť">&times;</button>
        </div>

        <div class="form-group">
            <label for="imageFiles">Vybrať fotky:</label>
            <input type="file" id="imageFiles" class="form-control" multiple accept="image/jpeg, image/png, image/jpg">
        </div>
        <div class="form-group">
            <label></label>
            <span id="fileCount" class="status" style="text-align: left; margin-top: 0;">Zatiaľ nie sú vybrané žiadne fotky.</span>
        </div>

        <div class="form-group">
            <label for="fps">Rýchlosť (FPS):</label>
            <div class="fps-wrap">
                <input type="number" id="fps" class="form-control" value="24" min="1" max="120">
                <span>snímok za sekundu</span>
            </div>
        </div>

        <div class="form-group">
            <label for="resolution">Rozlíšenie:</label>
            <select id="resolution" class="form-control">
                <option value="3840">4K (Vysoká kvalita)</option>
                <option value="1920" selected>Full HD (Plynulé prehrávanie)</option>
                <option value="720">HD (720p)</option>
                <option value="480">SD (480p - malé)</option>
                <option value="240">Nízka kvalita (240p - veľmi malé)</option>
            </select>
        </div>

        <div class="progress-container" id="progressWrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status" id="statusText">Pripravený na prácu. (Video sa uloží ako .webm)</div>

        <button id="startBtn" class="btn-primary">VYTVORIŤ TIMELAPSE</button>
        <button id="cancelBtn" class="btn-primary" style="display:none; margin-top: 10px; background-color: var(--danger-color);">ZRUŠIŤ</button>

        <!-- Skrytý canvas pre renderovanie videa -->
        <canvas id="previewCanvas"></canvas>
    </div>

    <div id="versionBadge"></div>

    <script src="resolution.js"></script>
    <script>
        const APP_VERSION = '1.8.0';
        const GITHUB_REPO = 'jan-tdy/jadiv-timelapse';

        function versionTuple(version) {
            // Prevedie napr. "v1.10" na [1, 10], aby sa dali verzie porovnávať číselne, nie ako text
            const parts = (version.match(/\d+/g) || []).map(Number);
            return parts.length ? parts : [0];
        }

        function isNewerVersion(latest, current) {
            const a = versionTuple(latest);
            const b = versionTuple(current);
            for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const diff = (a[i] || 0) - (b[i] || 0);
                if (diff !== 0) return diff > 0;
            }
            return false;
        }

        document.getElementById('versionBadge').innerText = `v${APP_VERSION}`;

        // Kontrola najnovšieho vydania na GitHube pri načítaní stránky (bez blokovania UI)
        fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`)
            .then(response => response.ok ? response.json() : null)
            .then(data => {
                if (!data || !data.tag_name) return;
                if (isNewerVersion(data.tag_name, APP_VERSION)) {
                    const banner = document.getElementById('updateBanner');
                    document.getElementById('updateBannerText').innerHTML =
                        `Je dostupná nová verzia <strong>${data.tag_name}</strong> ` +
                        `(aktuálna verzia: v${APP_VERSION}). ` +
                        `<a href="${data.html_url}" target="_blank" rel="noopener noreferrer">Zobraziť vydanie</a>`;
                    banner.classList.add('visible');
                }
            })
            .catch(() => {
                // Bez internetu / GitHub nedostupný / limit API - kontrola sa jednoducho preskočí
            });

        document.getElementById('updateBannerClose').addEventListener('click', () => {
            document.getElementById('updateBanner').classList.remove('visible');
        });

        const imageFilesInput = document.getElementById('imageFiles');
        const fpsInput = document.getElementById('fps');
        const resolutionSelect = document.getElementById('resolution');
        const startBtn = document.getElementById('startBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const fileCount = document.getElementById('fileCount');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        let cancelRequested = false;
        let isProcessing = false;

        // Upozorní pri zatvorení/opustení stránky, kým beží spracovanie (video by sa stratilo)
        window.addEventListener('beforeunload', (e) => {
            if (isProcessing) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        imageFilesInput.addEventListener('change', () => {
            const n = imageFilesInput.files.length;
            fileCount.innerText = n === 0
                ? 'Zatiaľ nie sú vybrané žiadne fotky.'
                : `Vybraných fotiek: ${n}`;
        });

        // Funkcia na načítanie obrázka
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error(`Nepodarilo sa načítať súbor "${file.name}"`));
                };
                img.src = url;
            });
        }

        // Pomocná funkcia na čakanie (simulácia FPS)
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        cancelBtn.addEventListener('click', () => {
            cancelRequested = true;
            cancelBtn.disabled = true;
            statusText.innerText = 'Rušenie...';
        });

        startBtn.addEventListener('click', async () => {
            const files = Array.from(imageFilesInput.files);

            if (files.length === 0) {
                alert('Prosím, vyberte aspoň jednu fotografiu.');
                return;
            }

            // Zoradenie súborov podľa názvu
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

            const fps = parseInt(fpsInput.value, 10);
            if (!Number.isFinite(fps) || fps < 1 || fps > 120) {
                alert('Rýchlosť (FPS) musí byť celé číslo medzi 1 a 120.');
                return;
            }

            const resolutionOption = resolutionSelect.options[resolutionSelect.selectedIndex];
            const resolutionValue = parseInt(resolutionOption.value, 10);
            const resolutionLabel = resolutionOption.text;

            // Uzamknutie UI
            cancelRequested = false;
            isProcessing = true;
            startBtn.disabled = true;
            startBtn.style.display = 'none';
            cancelBtn.style.display = 'block';
            cancelBtn.disabled = false;
            imageFilesInput.disabled = true;
            fpsInput.disabled = true;
            resolutionSelect.disabled = true;

            progressWrapper.style.display = 'block';
            progressBar.style.width = '0%';
            statusText.innerText = 'Analyzujem prvú snímku...';
            statusText.style.color = '#0d6efd';

            try {
                // 1. Zistiť rozmer z prvej načítateľnej fotky (prvý súbor môže byť poškodený)
                let firstImg = null;
                for (const file of files) {
                    try {
                        firstImg = await loadImage(file);
                        break;
                    } catch (e) {
                        console.warn(e);
                    }
                }
                if (!firstImg) {
                    throw new Error('Žiadnu z vybraných fotiek sa nepodarilo načítať.');
                }
                const { width: targetWidth, height: targetHeight } = computeTargetResolution(
                    firstImg.width, firstImg.height, resolutionLabel, resolutionValue
                );

                canvas.width = targetWidth;
                canvas.height = targetHeight;

                // Vykresliť prvú snímku na canvas ešte pred spustením captureStream/nahrávania,
                // aby stream nezachytil prázdny (čierny) canvas skôr, než sa stihne vykresliť prvý obrázok.
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(firstImg, 0, 0, targetWidth, targetHeight);

                statusText.innerText = `Výstupné rozlíšenie: ${targetWidth}×${targetHeight}. Spracovávam...`;

                // 2. Príprava MediaRecorder
                const stream = canvas.captureStream(fps);
                // Preferujeme VP9 pre lepšiu kvalitu, ak nie je k dispozícii, fallbackne sa na predvolený
                let options = { mimeType: 'video/webm; codecs=vp9' };
                let recorder;
                try {
                    recorder = new MediaRecorder(stream, options);
                } catch (e) {
                    recorder = new MediaRecorder(stream);
                }

                const chunks = [];
                recorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) {
                        chunks.push(e.data);
                    }
                };

                const recordingFinished = new Promise(resolve => {
                    recorder.onstop = resolve;
                });

                // Spustenie nahrávania
                recorder.start();

                // 3. Renderovanie snímok na Canvas
                const frameDurationMs = 1000 / fps;
                let drawnCount = 0;
                let skippedCount = 0;
                let wasCancelled = false;

                for (let i = 0; i < files.length; i++) {
                    if (cancelRequested) {
                        wasCancelled = true;
                        break;
                    }

                    const t0 = performance.now();

                    statusText.innerText = `Spracovávam: ${i + 1} / ${files.length} (výstup ${targetWidth}×${targetHeight})`;
                    progressBar.style.width = `${((i + 1) / files.length) * 100}%`;

                    // Načítať a vykresliť; poškodenú/nečitateľnú fotku len preskočíme
                    let img;
                    try {
                        img = await loadImage(files[i]);
                    } catch (e) {
                        console.warn(e);
                        skippedCount++;
                        continue;
                    }

                    // Vykreslenie s "vyhladením" (analógia cv2.INTER_AREA vo webe)
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                    drawnCount++;

                    // Vypočítať, koľko máme počkať, aby sme zachovali FPS
                    const t1 = performance.now();
                    const processTime = t1 - t0;
                    const waitTime = Math.max(0, frameDurationMs - processTime);

                    await sleep(waitTime);
                }

                // Trochu počkáme na poslednú snímku a zastavíme
                await sleep(100);
                recorder.stop();
                await recordingFinished;

                if (wasCancelled) {
                    statusText.innerText = 'Spracovanie bolo zrušené.';
                    statusText.style.color = '#aaa';
                } else if (drawnCount === 0) {
                    throw new Error('Ani jednu fotku sa nepodarilo spracovať, video nebolo vytvorené.');
                } else {
                    // 4. Stiahnutie hotového videa
                    statusText.innerText = 'Video sa generuje a sťahuje...';

                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const videoUrl = URL.createObjectURL(blob);

                    const downloadLink = document.createElement('a');
                    downloadLink.href = videoUrl;
                    downloadLink.download = 'jadiv_timelapse_web.webm';
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);

                    setTimeout(() => URL.revokeObjectURL(videoUrl), 10000);

                    statusText.innerText = skippedCount > 0
                        ? `Hotovo! Video bolo stiahnuté (preskočených poškodených fotiek: ${skippedCount}).`
                        : 'Hotovo! Video bolo stiahnuté.';
                    statusText.style.color = '#198754';
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = 'Nastala chyba: ' + err.message;
                statusText.style.color = '#dc3545';
            } finally {
                // Odomknutie UI
                cancelRequested = false;
                isProcessing = false;
                startBtn.disabled = false;
                startBtn.style.display = 'block';
                cancelBtn.style.display = 'none';
                imageFilesInput.disabled = false;
                fpsInput.disabled = false;
                resolutionSelect.disabled = false;
            }
        });
    </script>
</body>
</html>
