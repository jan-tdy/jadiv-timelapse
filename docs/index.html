<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadiv-Timelapse Web</title>
    <script defer src="https://keepandroidopen.org/banner.js"></script>
    <style>
        /* Modern dark mode design inspired by the PyQt5 app */
        :root {
            --bg-color: #2b2b2b;
            --surface-color: #3c3f41;
            --text-color: #e0e0e0;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --success-color: #198754;
            --border-color: #555555;
            --danger-color: #dc3545;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            width: 150px;
            font-weight: bold;
        }

        .form-control {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        input[type="file"] {
            padding: 7px;
        }

        input[type="file"]::file-selector-button {
            background-color: #444;
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .fps-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .fps-wrap input {
            width: 80px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 25px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            height: 24px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            background-color: var(--success-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-style: italic;
            color: #aaa;
            font-size: 14px;
        }

        #previewCanvas {
            display: none;
        }

        #versionBadge {
            position: fixed;
            bottom: 8px;
            right: 12px;
            font-size: 12px;
            color: #888888;
        }

        #updateBanner {
            display: none;
            background-color: var(--primary-color);
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        #updateBanner.visible {
            display: flex;
        }

        #updateBanner a {
            color: white;
            font-weight: bold;
        }

        #updateBanner button {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Jadiv-Timelapse Web</h1>

        <div id="updateBanner">
            <span id="updateBannerText"></span>
            <button id="updateBannerClose" title="Close" aria-label="Close">&times;</button>
        </div>

        <div class="form-group">
            <label for="imageFiles">Select photos:</label>
            <input type="file" id="imageFiles" class="form-control" multiple accept="image/jpeg, image/png, image/jpg">
        </div>
        <div class="form-group">
            <label></label>
            <span id="fileCount" class="status" style="text-align: left; margin-top: 0;">No photos selected yet.</span>
        </div>

        <div class="form-group">
            <label for="fps">Speed (FPS):</label>
            <div class="fps-wrap">
                <input type="number" id="fps" class="form-control" value="24" min="1" max="120">
                <span>frames per second</span>
            </div>
        </div>

        <div class="form-group">
            <label for="resolution">Resolution:</label>
            <select id="resolution" class="form-control">
                <option value="3840">4K (High quality)</option>
                <option value="1920" selected>Full HD (Smooth playback)</option>
                <option value="720">HD (720p)</option>
                <option value="480">SD (480p - small)</option>
                <option value="240">Low quality (240p - very small)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="watermarkToggle">Watermark:</label>
            <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
                <input type="checkbox" id="watermarkToggle" checked>
                Add closing watermark (4s, Jadiv-Timelapse promo)
            </label>
        </div>

        <div class="progress-container" id="progressWrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status" id="statusText">Ready. (The video will be saved as .webm)</div>

        <button id="startBtn" class="btn-primary">CREATE TIMELAPSE</button>
        <button id="cancelBtn" class="btn-primary" style="display:none; margin-top: 10px; background-color: var(--danger-color);">CANCEL</button>

        <!-- Hidden canvas for rendering the video -->
        <canvas id="previewCanvas"></canvas>
    </div>

    <div id="versionBadge"></div>

    <script src="resolution.js"></script>
    <script>
        const APP_VERSION = '1.11.0';
        const GITHUB_REPO = 'jan-tdy/jadiv-timelapse';

        const OUTRO_DURATION_SECONDS = 4;
        const OUTRO_LINE1 = 'Made by Jadiv-Timelapse';
        const OUTRO_LINE2 = 'Simple timelapse creation - no command-line needed';
        const OUTRO_LINE3 = `If you like this, star us on GitHub: github.com/${GITHUB_REPO}`;

        // (text, font size in px at the reference height of 720p, weight, color) -
        // sizes are 3x the original watermark
        const OUTRO_LINES = [
            { text: OUTRO_LINE1, px: 84, weight: 'bold', color: '#ffffff' },
            { text: OUTRO_LINE2, px: 45, weight: 'normal', color: '#dcdcdc' },
            { text: OUTRO_LINE3, px: 36, weight: 'normal', color: '#aaaaaa' },
        ];

        // Draws a photo onto the canvas while preserving its aspect ratio (letterbox/pillarbox)
        // instead of stretching it to fill the whole canvas - photos with a different aspect
        // ratio than the first photo (which the target resolution is derived from) would
        // otherwise get distorted.
        function drawLetterboxed(ctx, img, srcWidth, srcHeight, targetWidth, targetHeight) {
            const { width, height, xOffset, yOffset } = computeLetterboxLayout(
                srcWidth, srcHeight, targetWidth, targetHeight
            );
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, targetWidth, targetHeight);
            ctx.drawImage(img, xOffset, yOffset, width, height);
        }

        // Draws a black frame with the watermark at the end of the video (project promo)
        function drawOutroFrame(ctx, width, height) {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            const scale = height / 720;
            const maxTextWidth = width * 0.92;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // For each line, determine the font size and, at low resolutions (e.g. 240p),
            // shrink it if the longer text wouldn't fit the canvas width
            const lines = OUTRO_LINES.map(line => {
                let fontPx = Math.max(line.px * scale, line.px * 0.3);
                ctx.font = `${line.weight} ${fontPx}px 'Segoe UI', Arial, sans-serif`;
                const textWidth = ctx.measureText(line.text).width;
                if (textWidth > maxTextWidth) {
                    fontPx = Math.max(fontPx * (maxTextWidth / textWidth), line.px * 0.15);
                }
                return { ...line, fontPx, lineHeight: fontPx * 1.2 };
            });

            const gap = 18 * scale;
            const totalHeight = lines.reduce((sum, l) => sum + l.lineHeight, 0) + gap * (lines.length - 1);

            let y = height / 2 - totalHeight / 2;
            lines.forEach(line => {
                y += line.lineHeight / 2;
                ctx.fillStyle = line.color;
                ctx.font = `${line.weight} ${line.fontPx}px 'Segoe UI', Arial, sans-serif`;
                ctx.fillText(line.text, width / 2, y);
                y += line.lineHeight / 2 + gap;
            });
        }

        function versionTuple(version) {
            // Converts e.g. "v1.10" into [1, 10] so versions can be compared numerically, not as text
            const parts = (version.match(/\d+/g) || []).map(Number);
            return parts.length ? parts : [0];
        }

        function isNewerVersion(latest, current) {
            const a = versionTuple(latest);
            const b = versionTuple(current);
            for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const diff = (a[i] || 0) - (b[i] || 0);
                if (diff !== 0) return diff > 0;
            }
            return false;
        }

        document.getElementById('versionBadge').innerText = `v${APP_VERSION}`;

        // Check GitHub for the latest release on page load (without blocking the UI)
        fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`)
            .then(response => response.ok ? response.json() : null)
            .then(data => {
                if (!data || !data.tag_name) return;
                if (isNewerVersion(data.tag_name, APP_VERSION)) {
                    const banner = document.getElementById('updateBanner');
                    document.getElementById('updateBannerText').innerHTML =
                        `Version <strong>${data.tag_name}</strong> is available ` +
                        `(current version: v${APP_VERSION}). ` +
                        `<a href="${data.html_url}" target="_blank" rel="noopener noreferrer">View release</a>`;
                    banner.classList.add('visible');
                }
            })
            .catch(() => {
                // No internet / GitHub unreachable / API rate limit - the check is simply skipped
            });

        document.getElementById('updateBannerClose').addEventListener('click', () => {
            document.getElementById('updateBanner').classList.remove('visible');
        });

        const imageFilesInput = document.getElementById('imageFiles');
        const fpsInput = document.getElementById('fps');
        const resolutionSelect = document.getElementById('resolution');
        const watermarkToggle = document.getElementById('watermarkToggle');
        const startBtn = document.getElementById('startBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const fileCount = document.getElementById('fileCount');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        let cancelRequested = false;
        let isProcessing = false;

        // Warn when closing/leaving the page while processing is running (the video would be lost)
        window.addEventListener('beforeunload', (e) => {
            if (isProcessing) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        imageFilesInput.addEventListener('change', () => {
            const n = imageFilesInput.files.length;
            fileCount.innerText = n === 0
                ? 'No photos selected yet.'
                : `Photos selected: ${n}`;
        });

        // Function to load an image
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error(`Failed to load file "${file.name}"`));
                };
                img.src = url;
            });
        }

        // Helper function for waiting (simulates FPS)
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        cancelBtn.addEventListener('click', () => {
            cancelRequested = true;
            cancelBtn.disabled = true;
            statusText.innerText = 'Cancelling...';
        });

        startBtn.addEventListener('click', async () => {
            const files = Array.from(imageFilesInput.files);

            if (files.length === 0) {
                alert('Please select at least one photo.');
                return;
            }

            // Sort files by name
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

            const fps = parseInt(fpsInput.value, 10);
            if (!Number.isFinite(fps) || fps < 1 || fps > 120) {
                alert('Speed (FPS) must be a whole number between 1 and 120.');
                return;
            }

            const resolutionOption = resolutionSelect.options[resolutionSelect.selectedIndex];
            const resolutionValue = parseInt(resolutionOption.value, 10);
            const resolutionLabel = resolutionOption.text;

            // Lock the UI
            cancelRequested = false;
            isProcessing = true;
            startBtn.disabled = true;
            startBtn.style.display = 'none';
            cancelBtn.style.display = 'block';
            cancelBtn.disabled = false;
            imageFilesInput.disabled = true;
            fpsInput.disabled = true;
            resolutionSelect.disabled = true;
            watermarkToggle.disabled = true;

            progressWrapper.style.display = 'block';
            progressBar.style.width = '0%';
            statusText.innerText = 'Analyzing the first frame...';
            statusText.style.color = '#0d6efd';

            try {
                // 1. Determine dimensions from the first loadable photo (the first file may be corrupted)
                let firstImg = null;
                for (const file of files) {
                    try {
                        firstImg = await loadImage(file);
                        break;
                    } catch (e) {
                        console.warn(e);
                    }
                }
                if (!firstImg) {
                    throw new Error('None of the selected photos could be loaded.');
                }
                const { width: targetWidth, height: targetHeight } = computeTargetResolution(
                    firstImg.width, firstImg.height, resolutionLabel, resolutionValue
                );

                canvas.width = targetWidth;
                canvas.height = targetHeight;

                // Draw the first frame onto the canvas before starting captureStream/recording,
                // so the stream doesn't capture an empty (black) canvas before the first image is drawn.
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                drawLetterboxed(ctx, firstImg, firstImg.width, firstImg.height, targetWidth, targetHeight);

                statusText.innerText = `Output resolution: ${targetWidth}×${targetHeight}. Processing...`;

                // 2. Prepare MediaRecorder
                const stream = canvas.captureStream(fps);
                // Prefer VP9 for better quality, fall back to the default if unavailable
                let options = { mimeType: 'video/webm; codecs=vp9' };
                let recorder;
                try {
                    recorder = new MediaRecorder(stream, options);
                } catch (e) {
                    recorder = new MediaRecorder(stream);
                }

                const chunks = [];
                recorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) {
                        chunks.push(e.data);
                    }
                };

                const recordingFinished = new Promise(resolve => {
                    recorder.onstop = resolve;
                });

                // Start recording
                recorder.start();

                // 3. Render frames onto the canvas
                const frameDurationMs = 1000 / fps;
                let drawnCount = 0;
                let skippedCount = 0;
                let wasCancelled = false;

                for (let i = 0; i < files.length; i++) {
                    if (cancelRequested) {
                        wasCancelled = true;
                        break;
                    }

                    const t0 = performance.now();

                    statusText.innerText = `Processing: ${i + 1} / ${files.length} (output ${targetWidth}×${targetHeight})`;
                    progressBar.style.width = `${((i + 1) / files.length) * 100}%`;

                    // Load and draw; a corrupted/unreadable photo is simply skipped
                    let img;
                    try {
                        img = await loadImage(files[i]);
                    } catch (e) {
                        console.warn(e);
                        skippedCount++;
                        continue;
                    }

                    // Draw with "smoothing" (analogous to cv2.INTER_AREA on the web), preserving
                    // the aspect ratio (letterbox/pillarbox) for photos with a different aspect
                    // ratio than the first photo
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    drawLetterboxed(ctx, img, img.width, img.height, targetWidth, targetHeight);
                    drawnCount++;

                    // Compute how long to wait to maintain the target FPS
                    const t1 = performance.now();
                    const processTime = t1 - t0;
                    const waitTime = Math.max(0, frameDurationMs - processTime);

                    await sleep(waitTime);
                }

                // Watermark at the end of the video (project promo) - only if processing
                // completed successfully, not on cancellation, and only if the toggle is on
                if (!wasCancelled && drawnCount > 0 && watermarkToggle.checked) {
                    statusText.innerText = 'Adding closing watermark...';
                    drawOutroFrame(ctx, targetWidth, targetHeight);
                    await sleep(OUTRO_DURATION_SECONDS * 1000);
                }

                // Wait a bit for the last frame and then stop
                await sleep(100);
                recorder.stop();
                await recordingFinished;

                if (wasCancelled) {
                    statusText.innerText = 'Processing was cancelled.';
                    statusText.style.color = '#aaa';
                } else if (drawnCount === 0) {
                    throw new Error('None of the photos could be processed, no video was created.');
                } else {
                    // 4. Download the finished video
                    statusText.innerText = 'Generating and downloading the video...';

                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const videoUrl = URL.createObjectURL(blob);

                    const downloadLink = document.createElement('a');
                    downloadLink.href = videoUrl;
                    downloadLink.download = 'jadiv_timelapse_web.webm';
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);

                    setTimeout(() => URL.revokeObjectURL(videoUrl), 10000);

                    statusText.innerText = skippedCount > 0
                        ? `Done! The video was downloaded (skipped corrupted photos: ${skippedCount}).`
                        : 'Done! The video was downloaded.';
                    statusText.style.color = '#198754';
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = 'An error occurred: ' + err.message;
                statusText.style.color = '#dc3545';
            } finally {
                // Unlock the UI
                cancelRequested = false;
                isProcessing = false;
                startBtn.disabled = false;
                startBtn.style.display = 'block';
                cancelBtn.style.display = 'none';
                imageFilesInput.disabled = false;
                fpsInput.disabled = false;
                resolutionSelect.disabled = false;
                watermarkToggle.disabled = false;
            }
        });
    </script>
</body>
</html>
