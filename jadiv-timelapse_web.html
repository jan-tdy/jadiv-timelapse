<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadiv-Timelapse Web</title>
    <style>
        /* Moderný Dark Mode dizajn inšpirovaný tvojou PyQt5 aplikáciou */
        :root {
            --bg-color: #2b2b2b;
            --surface-color: #3c3f41;
            --text-color: #e0e0e0;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --success-color: #198754;
            --border-color: #555555;
            --danger-color: #dc3545;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            width: 150px;
            font-weight: bold;
        }

        .form-control {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        input[type="file"] {
            padding: 7px;
        }

        input[type="file"]::file-selector-button {
            background-color: #444;
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .fps-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .fps-wrap input {
            width: 80px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 25px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            height: 24px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            background-color: var(--success-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .status {
            text-align: center;
            margin-top: 10px;
            font-style: italic;
            color: #aaa;
            font-size: 14px;
        }

        #previewCanvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Jadiv-Timelapse Web</h1>

        <div class="form-group">
            <label for="imageFiles">Vybrať fotky:</label>
            <input type="file" id="imageFiles" class="form-control" multiple accept="image/jpeg, image/png, image/jpg">
        </div>

        <div class="form-group">
            <label for="fps">Rýchlosť (FPS):</label>
            <div class="fps-wrap">
                <input type="number" id="fps" class="form-control" value="24" min="1" max="60">
                <span>snímok za sekundu</span>
            </div>
        </div>

        <div class="form-group">
            <label for="resolution">Rozlíšenie:</label>
            <select id="resolution" class="form-control">
                <option value="3840">4K (Vysoká kvalita)</option>
                <option value="1920" selected>Full HD (Plynulé prehrávanie)</option>
                <option value="1280">HD (720p)</option>
                <option value="854">SD (480p - malé)</option>
                <option value="426">Nízka kvalita (240p - veľmi malé)</option>
            </select>
        </div>

        <div class="progress-container" id="progressWrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status" id="statusText">Pripravený na prácu. (Video sa uloží ako .webm)</div>

        <button id="startBtn" class="btn-primary">VYTVORIŤ TIMELAPSE</button>

        <!-- Skrytý canvas pre renderovanie videa -->
        <canvas id="previewCanvas"></canvas>
    </div>

    <script>
        const imageFilesInput = document.getElementById('imageFiles');
        const fpsInput = document.getElementById('fps');
        const resolutionSelect = document.getElementById('resolution');
        const startBtn = document.getElementById('startBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        // Funkcia na načítanie obrázka
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = reject;
                img.src = url;
            });
        }

        // Pomocná funkcia na čakanie (simulácia FPS)
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        startBtn.addEventListener('click', async () => {
            const files = Array.from(imageFilesInput.files);
            
            if (files.length === 0) {
                alert('Prosím, vyberte aspoň jednu fotografiu.');
                return;
            }

            // Zoradenie súborov podľa názvu
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

            const fps = parseInt(fpsInput.value, 10);
            const targetWidthStr = parseInt(resolutionSelect.value, 10);

            // Uzamknutie UI
            startBtn.disabled = true;
            imageFilesInput.disabled = true;
            fpsInput.disabled = true;
            resolutionSelect.disabled = true;
            
            progressWrapper.style.display = 'block';
            progressBar.style.width = '0%';
            statusText.innerText = 'Analyzujem prvú snímku...';
            statusText.style.color = '#0d6efd';

            try {
                // 1. Zistiť rozmer z prvej fotky
                const firstImg = await loadImage(files[0]);
                const aspect = firstImg.height / firstImg.width;
                
                let targetWidth = targetWidthStr;
                let targetHeight = Math.round(targetWidth * aspect);

                // Zabezpečenie párnych čísel (vyžadujú to video kodeky)
                targetWidth -= targetWidth % 2;
                targetHeight -= targetHeight % 2;

                canvas.width = targetWidth;
                canvas.height = targetHeight;

                // 2. Príprava MediaRecorder
                const stream = canvas.captureStream(fps);
                // Preferujeme VP9 pre lepšiu kvalitu, ak nie je k dispozícii, fallbackne sa na predvolený
                let options = { mimeType: 'video/webm; codecs=vp9' };
                let recorder;
                try {
                    recorder = new MediaRecorder(stream, options);
                } catch (e) {
                    recorder = new MediaRecorder(stream);
                }

                const chunks = [];
                recorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) {
                        chunks.push(e.data);
                    }
                };

                const recordingFinished = new Promise(resolve => {
                    recorder.onstop = resolve;
                });

                // Spustenie nahrávania
                recorder.start();

                // 3. Renderovanie snímok na Canvas
                const frameDurationMs = 1000 / fps;
                
                for (let i = 0; i < files.length; i++) {
                    const t0 = performance.now();
                    
                    statusText.innerText = `Spracovávam: ${i + 1} / ${files.length}`;
                    progressBar.style.width = `${((i + 1) / files.length) * 100}%`;

                    // Načítať a vykresliť
                    const img = await loadImage(files[i]);
                    
                    // Vykreslenie s "vyhladením" (analógia cv2.INTER_AREA vo webe)
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                    // Vypočítať, koľko máme počkať, aby sme zachovali FPS
                    const t1 = performance.now();
                    const processTime = t1 - t0;
                    const waitTime = Math.max(0, frameDurationMs - processTime);
                    
                    await sleep(waitTime);
                }

                // Trochu počkáme na poslednú snímku a zastavíme
                await sleep(100); 
                recorder.stop();
                await recordingFinished;

                // 4. Stiahnutie hotového videa
                statusText.innerText = 'Video sa generuje a sťahuje...';
                
                const blob = new Blob(chunks, { type: 'video/webm' });
                const videoUrl = URL.createObjectURL(blob);
                
                const downloadLink = document.createElement('a');
                downloadLink.href = videoUrl;
                downloadLink.download = 'jadiv_timelapse_web.webm';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                
                setTimeout(() => URL.revokeObjectURL(videoUrl), 10000);

                statusText.innerText = 'Hotovo! Video bolo stiahnuté.';
                statusText.style.color = '#198754';

            } catch (err) {
                console.error(err);
                statusText.innerText = 'Nastala chyba: ' + err.message;
                statusText.style.color = '#dc3545';
            } finally {
                // Odomknutie UI
                startBtn.disabled = false;
                imageFilesInput.disabled = false;
                fpsInput.disabled = false;
                resolutionSelect.disabled = false;
            }
        });
    </script>
</body>
</html>
